<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantifyre Iris - Agency Login</title>
    <link rel="stylesheet" href="Css/style.css">
    <link rel="stylesheet" href="Css/sidebar.css">
    <link href="Css/fontstyle.css" rel="stylesheet">
    <link rel="stylesheet" href="Css/all.css">
    <script src="Js/auth-guard.js"></script>

</head>

<body class="lbody">
    <div class="login-card">
        <div class="logo-section">
            <img src="Images/quantifirelogo.png" alt="Quantifyre Iris Logo" class="logo">
        </div>

        <h2 class="form-title">Agency Login</h2>

        <form action="#">
            <div class="input-group">
                <label for="email">Email Id</label>
                <div class="input-wrapper">
                    <input type="email" id="email" placeholder="Enter Your Email" required>
                    <i class="fa-regular fa-envelope input-icon"></i>
                </div>
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <input type="password" id="password" placeholder="Enter Your Password" autocomplete="off" required>
                    <i class="fa-regular fa-eye input-icon" id="toggleEye" style="cursor: pointer; z-index: 10;"></i>
                </div>

                <p id="loginError" class="error-text"></p>
            </div>

            <!-- <div class="forgot-pass">
                <a href="#">Forgot password?</a>
            </div> -->

            <button type="submit" class="login-btn" id="loginbtn">Login</button>
        </form>
    </div>

    <script src="Js/jquery-3.7.1.min.js"></script>

    <script>
        $(document).ready(function () {

            // --- PASSWORD SHOW/HIDE ---
            $('#toggleEye').click(function () {
                var passwordField = $('#password');
                var icon = $(this);
                var type = passwordField.attr('type') === 'password' ? 'text' : 'password';
                passwordField.attr('type', type);
                if (type === 'text') {
                    icon.removeClass('fa-eye').addClass('fa-eye-slash');
                } else {
                    icon.removeClass('fa-eye-slash').addClass('fa-eye');
                }
            });

            // --- LOGIN LOGIC ---
            $("#loginbtn").click(function (e) {
                e.preventDefault();

                // 1. Inputs aur Button select karein
                var userEmail = $("#email").val().trim();
                var userPassword = $("#password").val().trim();
                var $btn = $(this); // 🌟 Button ko variable mein liya

                // Simple validation check
                if (userEmail === "" || userPassword === "") {
                    $("#loginError").text("Please fill all fields").show();
                    return;
                }

                // 2. Button ko "Verifying..." par set karein aur disable karein
                $btn.text("Verifying...").prop("disabled", true);

                $.ajax({
                    url: "https://quantifire-iris-backend.onrender.com/api/agency/login",
                    type: "POST",
                    contentType: "application/json",
                    xhrFields: {
                        withCredentials: true
                    },
                    data: JSON.stringify({ email: userEmail, password: userPassword }),
                    success: function (response) {
                        if (response.status === "success") {

                            // 3. Button Text Update on Success
                            $btn.text("Login Successful!");

                            localStorage.setItem("isAgencyLoggedIn", "true");
                            localStorage.setItem("agencyId", response.agencyId);
                            localStorage.setItem("agencyName", response.agencyName);
                            localStorage.setItem("agencyEmail", response.agencyEmail);
                            localStorage.setItem("loginTime", response.loginTime);

                             document.cookie = "isAgencyLoggedIn=true; path=/; max-age=86400; SameSite=Lax";


                            setTimeout(function () {
                                window.location.href = "AgencyDashboard.html";
                            }, 500);
                        }
                    },
                    error: function (xhr) {
                        // 4. Error aane par button ko wapas normal karein
                        $btn.text("Login").prop("disabled", false);

                        if (xhr.status === 401 || xhr.status === 400) {
                            $("#loginError").text("Invalid Credentials").show();
                        } else {
                            $("#loginError").text("Server error. Please try again later.").show();
                        }
                    }
                });
            });
            
            $("input").on("input", function () {
                $(this).removeClass("input-error");
                $("#loginError").hide();
            });

        });
    </script>
     <script src="Js/jquery-3.7.1.min.js"></script>
     <script src="Js/allagency.js"></script>
     <script src="Js/auth-guard.js"></script>
</body>

</html>
